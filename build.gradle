plugins {
    id 'java'
    // Provide convenience executables for trying out the examples.
    id 'application'
    id 'com.google.protobuf' version '0.9.4'
    // Generate IntelliJ IDEA's .idea & .iml project files
    id 'idea'
    id 'jacoco'
}

configurations {
    jacocoAgent
    jacocoAnt
}

group = 'io.automationhacks'
version = '1.0-SNAPSHOT'

repositories {
    maven { // The google mirror is less flaky than mavenCentral()
        url "https://maven-central.storage-download.googleapis.com/maven2/"
    }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def grpcVersion = '1.61.0'
def protobufVersion = '3.25.1'
def protocVersion = protobufVersion

dependencies {
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-services:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    compileOnly "org.apache.tomcat:annotations-api:6.0.53"

    // examples/advanced need this for JsonFormat
    implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"

    implementation 'com.github.myzhan:locust4j:2.2.3'

    runtimeOnly "io.grpc:grpc-netty-shaded:${grpcVersion}"

    implementation 'com.google.truth:truth:1.4.2'
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:4.4.0"
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    testImplementation 'org.testng:testng:7.8.0'
    implementation 'org.jacoco:org.jacoco.agent:0.8.11'
    implementation 'org.jacoco:org.jacoco.core:0.8.11'
    jacocoAgent "org.jacoco:org.jacoco.agent:0.8.11:runtime"
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${protocVersion}" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" }
    }
    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}

// Inform IDEs like IntelliJ IDEA, Eclipse or NetBeans about the generated code.
sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
    test {
        java {
            srcDirs 'src/test/java/io/automationhacks/helloworld'
            srcDirs 'src/test/java/io/automationhacks/routeguide'
        }
    }
}

tasks.register('runTests', Test) {
    useTestNG() {
        testLogging.showStandardStreams = true
    }

    // JaCoCo report is generated after test run finishes
    finalizedBy jacocoTestReport

    doFirst {
        // Ensure the coverage file directory exists
        file("${buildDir}/jacoco").mkdirs()
    }
}

test {
    useJUnit()

    // JaCoCo report is generated after test run finishes
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    // the task has a dependency on tests to be run before coverage could be generated
    dependsOn test
    dependsOn runTests

    executionData files("${buildDir}/jacoco/server.exec")

    doFirst {
        executionData.from(files(executionData.files.findAll { it.exists() }))
        println "Looking for coverage data in: ${executionData.files}"
    }

    // We can specify different formats in which JaCoCo returns code coverage data in
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}

// Add JaCoCo runtime agent configuration
def jacocoAgent = "$buildDir/tmp/jacocoagent.jar"
task copyJacocoAgent(type: Copy) {
    from configurations.jacocoAgent
    into "$buildDir/tmp"
    rename { 'jacocoagent.jar' }
}

// Task to start the gRPC server with JaCoCo agent
task runServerWithCoverage(type: JavaExec) {
    doFirst {
        // Ensure directory exists
        file("${buildDir}/jacoco").mkdirs()

        // Log the JaCoCo configuration
        println "JaCoCo agent path: ${configurations.jacocoAgent.singleFile}"
        println "Coverage file will be written to: ${buildDir}/jacoco/server.exec"
    }

    dependsOn copyJacocoAgent
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.automationhacks.routeguide.RouteGuideServer' // Replace with your server main class

    jvmArgs = [
            "-javaagent:${jacocoAgent}=destfile=${buildDir}/jacoco/server.exec,output=tcpserver,address=*,port=6300,dumponexit=true"
    ]
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    violationRules {
        rule {
            enabled = true
            includes = ['io.automationhacks.routeguide*']

            limit {
                minimum = 0.4
            }
        }

        rule {
            enabled = true
            element = 'CLASS'
            includes = ['io.automationhacks.routeguide*']
            excludes = ['io.automationhacks.routeguide.RouteGuideClient.TestHelper']

            limit {
                counter = 'LINE'
                value = 'TOTALCOUNT'
                minimum = 0.4
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

startScripts.enabled = false

// Creates start scripts for a class name and adds it to the distribution. The
// base class name is used to name the task and scripts. For example, passed
// the class io.grpc.examples.helloworld.HelloWorldClient, it creates the task
// helloWorldClient with script name hello-world-client.
def createStartScripts(String mainClassName) {
    String bareName = mainClassName.substring(mainClassName.lastIndexOf('.') + 1);
    String taskName = bareName.uncapitalize();
    def newTask = tasks.register(taskName, CreateStartScripts) {
        mainClass = mainClassName
        applicationName = taskName.replaceAll('([A-Z])') { '-' + it[0].uncapitalize() }
        outputDir = new File(project.buildDir, 'tmp/scripts/' + name)
        classpath = startScripts.classpath
    }
    application {
        applicationDistribution.into('bin') {
            from(newTask)
            fileMode = 0755
        }
    }
}

createStartScripts('io.automationhacks.helloworld.HelloWorldClient')
createStartScripts('io.automationhacks.helloworld.HelloWorldServer')
createStartScripts('io.automationhacks.routeguide.RouteGuideClient')
createStartScripts('io.automationhacks.routeguide.RouteGuideServer')

// Create executable jar with dependencies
tasks.register('assembleJar', Jar) {
    archiveName = 'grasp-grpc-testing.jar'
    from sourceSets.main.allSource
    manifest {
        attributes 'Main-Class': 'io.automationhacks.routeguide.perf.RouteGuideLoadGen'
    }
    dependsOn configurations.runtimeClasspath
}